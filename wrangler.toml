name = "flight-stats-aerodatabox"
main = "worker.js"
compatibility_date = "2024-08-23"

# Environment variables
[vars]
AERODATABOX_HOST = "aerodatabox.p.rapidapi.com"

# Development settings
[dev]
port = 8787
local_protocol = "http"
# Disable file watching to avoid .Trash permission errors on macOS
watch = false

# Disable bundling for simpler deployments
[build]
command = "echo 'No build needed'"
