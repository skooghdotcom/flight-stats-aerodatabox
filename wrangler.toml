name = "flight-stats-aerodatabox"
main = "worker.js"
compatibility_date = "2024-08-23"

# Workers Sites configuration
[site]
bucket = "./public"

# Environment variables
[vars]
AERODATABOX_HOST = "aerodatabox.p.rapidapi.com"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Build optimizations
[build]
command = "echo 'No build step needed'"

# Enable minification
minify = true

# Optional: Custom domain
# [[routes]]
# pattern = "flight-stats.yourdomain.com"
# zone_name = "yourdomain.com"
